name: Run Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Xvfb (virtual display, so the existing headed ChromeDriver setup works unmodified)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run test suite
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-output/
            target/surefire-reports/
          if-no-files-found: ignore
